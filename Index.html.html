</head>

// 1 Pong

// 4 Tetris
function tet(){const B=[...Array(18)].map(_=>Array(10).fill(0));
 const PS=['0000111100000000','0110011000000000','0100111000000000','0110110000000000','1100011000000000','1000111000000000','0010111000000000'].map(s=>[...s].map(Number));

  T('SCORE',86,12);T(s,86,22);T('LINES',86,38);T(ln,86,48);T('NEXT',86,66);PS[nx].forEach((v,i)=>{if(v)R(0,92+(i%4)*6,74+(i>>2)*6,5,5)});T('A:turn',86,126);T('B:drop',86,136)}}}

// 10 Echo (memory)
function echo(){let sq=[rnd(4)],ph=0,i=0,t=.6,lit=-1,s=0;const kk=['u','r','d','l'],pos=[[60,20],[108,56],[60,92],[12,56]],fq=[500,600,700,400];

// 11 Merge (2048)
function m2048(){const G=Array(16).fill(0);let s=0;
